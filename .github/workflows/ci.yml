name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Les tests ne dépendent pas de JavaFX (logique pure) : pas besoin d'écran.
      - name: Compiler et tester
        run: mvn -B verify
